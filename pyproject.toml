[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
dynamic = ["version"]
description = "Windows optimization toolkit with reversible, auditable tweaks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyinstaller>=6.16",
]

[project.scripts]
sage = "cli.main:app"

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.setuptools.package-data]
core = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches the real Windows registry (throwaway HKCU keys only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
